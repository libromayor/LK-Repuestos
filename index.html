<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Refacciones — Control de Inventario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1B1D21;
    --surface: #24262B;
    --surface-2: #2E3137;
    --surface-3: #34373E;
    --accent: #F2A93B;
    --accent-dim: #8a6428;
    --good: #6FA96C;
    --danger: #E15A4C;
    --text: #ECE9E4;
    --text-muted: #9CA0A6;
    --border: #383B42;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Mono', monospace;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  #app{display:flex; min-height:100vh;}

  /* ---- Sidebar ---- */
  .sidebar{
    width:200px;
    flex-shrink:0;
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding:20px 0;
  }
  .brand{
    padding:0 20px 20px 20px;
    border-bottom:1px solid var(--border);
    margin-bottom:16px;
  }
  .brand .mark{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:34px;height:34px;
    background:var(--accent);
    color:#1B1D21;
    font-family:'Oswald',sans-serif;
    font-weight:700;
    border-radius:4px;
    margin-bottom:10px;
    font-size:16px;
  }
  .brand h1{font-size:16px; margin:0; color:var(--text); line-height:1.2;}
  .brand p{font-size:10px; color:var(--text-muted); margin:4px 0 0 0; letter-spacing:0.08em;}
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:11px 20px;
    color:var(--text-muted);
    cursor:pointer;
    font-size:12px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    font-family:'Oswald', sans-serif;
    font-weight:500;
    border-left:3px solid transparent;
    transition:all .15s ease;
  }
  .nav-item:hover{color:var(--text); background:var(--surface-2);}
  .nav-item.active{color:var(--accent); border-left-color:var(--accent); background:var(--surface-2);}
  .nav-item .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}

  /* ---- Main ---- */
  .main{flex:1; padding:28px 34px; max-width:1180px;}
  .page-header{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; flex-wrap:wrap; gap:12px;}
  .page-header h2{font-size:24px; margin:0; color:var(--text);}
  .page-header .sub{font-size:12px; color:var(--text-muted); margin-top:4px; text-transform:none; letter-spacing:0;}

  /* ---- Buttons ---- */
  .btn{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:12px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:10px 18px;
    border-radius:3px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
  }
  .btn:hover{background:var(--surface-3);}
  .btn-accent{background:var(--accent); border-color:var(--accent); color:#1B1D21;}
  .btn-accent:hover{background:#ffbb4f;}
  .btn-danger{background:transparent; border-color:var(--danger); color:var(--danger);}
  .btn-danger:hover{background:rgba(225,90,76,0.12);}
  .btn-ghost{background:transparent; border-color:transparent; color:var(--text-muted); padding:6px 10px;}
  .btn-ghost:hover{color:var(--text);}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}

  /* ---- Stat strip ---- */
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:26px;}
  .stat-plate{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:5px;
    padding:16px 18px;
    position:relative;
    overflow:hidden;
  }
  .stat-plate::before{
    content:'';
    position:absolute; top:8px; right:8px;
    width:5px; height:5px; border-radius:50%;
    background:var(--border);
    box-shadow: -6px 0 0 var(--border);
  }
  .stat-plate .label{font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.08em; font-family:'Oswald',sans-serif;}
  .stat-plate .value{font-size:24px; font-weight:600; margin-top:6px; font-family:'Oswald',sans-serif;}
  .stat-plate .value.accent{color:var(--accent);}
  .stat-plate .value.good{color:var(--good);}
  .stat-plate .value.danger{color:var(--danger);}

  /* ---- Cards / tables ---- */
  .card{background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:20px;}
  .card + .card{margin-top:18px;}
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{
    text-align:left; font-family:'Oswald',sans-serif; font-weight:500; font-size:10.5px;
    text-transform:uppercase; letter-spacing:0.07em; color:var(--text-muted);
    padding:0 10px 10px 10px; border-bottom:1px solid var(--border);
  }
  td{padding:11px 10px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.row-hover:hover{background:var(--surface-2);}
  .empty{
    text-align:center; padding:40px 20px; color:var(--text-muted);
  }
  .empty .display{color:var(--text); font-size:16px; margin-bottom:6px;}

  /* ---- Tags / badges ---- */
  .badge{display:inline-block; padding:3px 8px; border-radius:3px; font-size:10px; font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.05em; font-weight:600;}
  .badge-ok{background:rgba(111,169,108,0.15); color:var(--good);}
  .badge-low{background:rgba(225,90,76,0.15); color:var(--danger);}
  .cat-pill{background:var(--surface-3); color:var(--text-muted); padding:3px 9px; border-radius:12px; font-size:10.5px;}

  /* ---- Part hang-tag (signature element) ---- */
  .tag-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:16px;}
  .part-tag{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:0 8px 8px 8px;
    position:relative;
    padding:18px 16px 14px 16px;
  }
  .part-tag::before{
    content:'';
    position:absolute;
    top:-1px; left:-1px;
    width:26px; height:26px;
    background:var(--bg);
    border-right:1px solid var(--border);
    border-bottom:1px solid var(--border);
    border-radius:0 0 8px 0;
  }
  .part-tag::after{
    content:'';
    position:absolute;
    top:8px; left:8px;
    width:9px; height:9px;
    border-radius:50%;
    background:var(--bg);
    border:1px solid var(--border);
  }
  .part-tag .ribbon{
    position:absolute; top:10px; right:-6px;
    background:var(--danger); color:#1B1D21;
    font-family:'Oswald',sans-serif; font-weight:700; font-size:9px;
    letter-spacing:0.06em;
    padding:3px 10px 3px 8px;
    border-radius:2px 0 0 2px;
  }
  .part-tag h3{font-size:15px; margin:0 0 2px 20px; color:var(--text);}
  .part-tag .sku{font-size:10.5px; color:var(--text-muted); margin:0 0 12px 20px;}
  .part-tag .row{display:flex; justify-content:space-between; font-size:12px; padding:4px 0; border-top:1px dashed var(--border);}
  .part-tag .row .k{color:var(--text-muted);}
  .part-tag .row .v{font-weight:600;}
  .part-tag .actions{display:flex; gap:8px; margin-top:12px;}

  /* ---- Forms ---- */
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field.full{grid-column:1/-1;}
  label{font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-muted); font-family:'Oswald',sans-serif;}
  input, select{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 10px;
    border-radius:4px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
  }
  input:focus, select:focus{outline:2px solid var(--accent); outline-offset:0; border-color:var(--accent);}
  .form-actions{display:flex; gap:10px; margin-top:16px; grid-column:1/-1;}

  .toast{
    position:fixed; bottom:24px; right:24px;
    background:var(--surface-3); border:1px solid var(--accent);
    padding:12px 18px; border-radius:5px; font-size:12.5px;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
    z-index:100;
  }
  .banner{
    background:rgba(242,169,59,0.12); border:1px solid var(--accent-dim);
    color:var(--text); padding:10px 16px; border-radius:5px;
    font-size:12px; margin-bottom:18px;
  }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6);
    display:flex; align-items:center; justify-content:center;
    z-index:200; padding:20px;
  }
  .modal-box{
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:22px; max-width:360px; width:100%;
  }
  .modal-box p{font-size:13px; line-height:1.5; margin:0 0 18px 0; color:var(--text);}
  .modal-actions{display:flex; gap:10px; justify-content:flex-end;}
  .section-title{font-size:13px; color:var(--text-muted); margin:22px 0 10px 0; text-transform:uppercase; letter-spacing:0.07em; font-family:'Oswald',sans-serif;}
  .hint{font-size:11px; color:var(--text-muted); margin-top:2px;}

  @media (max-width: 820px){
    #app{flex-direction:column;}
    .sidebar{width:100%; flex-direction:row; overflow-x:auto; padding:10px;}
    .brand{display:none;}
    .nav-item{border-left:none; border-bottom:3px solid transparent; white-space:nowrap;}
    .nav-item.active{border-bottom-color:var(--accent);}
    .stats{grid-template-columns:repeat(2,1fr);}
    .form-grid{grid-template-columns:1fr;}
    .main{padding:18px;}
  }
</style>

</head>
<body>
<div id="app"><div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px; color:#ECE9E4; font-family:'IBM Plex Mono', monospace; text-align:center;">Cargando…</div></div>
<noscript><div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px; color:#ECE9E4; font-family:monospace; text-align:center; background:#1B1D21;">Esta página necesita JavaScript activado para funcionar.</div></noscript>
<script>

"use strict";

// ============================================================
// Configuracion — este proyecto vive en un repositorio de GitHub.
// data.json en ese repositorio ES el inventario compartido: cada vez
// que alguien guarda un cambio aqui, se escribe ahi mismo, y cualquier
// otra persona que abra este mismo link ve lo mas reciente.
// ============================================================
var GH_OWNER = 'libromayor';
var GH_REPO = 'LK-Repuestos';
var GH_PATH = 'data.json';
var GH_BRANCH = 'main';
var GH_TOKEN = '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';
var PASSWORD_HASH = '50c9b57cb3613e3402162f0690951900d8540a493469a8ca1d881779352f1a44';
var UNLOCK_KEY = 'refacciones-unlocked-v1';

var currentSha = null;

function b64EncodeUtf8(str){
  var bytes = new TextEncoder().encode(str);
  var binary = '';
  bytes.forEach(function(b){ binary += String.fromCharCode(b); });
  return btoa(binary);
}
function b64DecodeUtf8(b64){
  var binary = atob(b64.replace(/\n/g, ''));
  var bytes = new Uint8Array(binary.length);
  for (var i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
async function sha256Hex(str){
  var enc = new TextEncoder().encode(str);
  var buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
}

function ghUrl(){
  return 'https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/contents/' + GH_PATH;
}

async function ghGetFile(){
  var res = await fetch(ghUrl() + '?ref=' + encodeURIComponent(GH_BRANCH), {
    headers: { 'Authorization': 'Bearer ' + GH_TOKEN, 'Accept': 'application/vnd.github+json' }
  });
  if(res.status === 404){ return { data: {parts:[], sales:[]}, sha: null }; }
  if(!res.ok){
    var t = await res.text().catch(function(){ return String(res.status); });
    var err = new Error('No se pudo leer el inventario (código ' + res.status + ').'); err.code = 'http_' + res.status; err.detail = t;
    throw err;
  }
  var json = await res.json();
  var text = b64DecodeUtf8(json.content);
  var data;
  try{ data = JSON.parse(text); }catch(e){ data = {parts:[], sales:[]}; }
  return { data: { parts: Array.isArray(data.parts)?data.parts:[], sales: Array.isArray(data.sales)?data.sales:[] }, sha: json.sha };
}

async function ghPutFile(newData, sha, message){
  var body = {
    message: message || ('Actualizar inventario ' + new Date().toISOString()),
    content: b64EncodeUtf8(JSON.stringify(newData, null, 2)),
    branch: GH_BRANCH,
  };
  if(sha) body.sha = sha;
  var res = await fetch(ghUrl(), {
    method: 'PUT',
    headers: { 'Authorization': 'Bearer ' + GH_TOKEN, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if(res.status === 409){ var conflictErr = new Error('conflict'); conflictErr.code = 'conflict'; throw conflictErr; }
  if(!res.ok){
    var t = await res.text().catch(function(){ return String(res.status); });
    var err = new Error('No se pudo guardar (código ' + res.status + ').'); err.code = 'http_' + res.status; err.detail = t;
    throw err;
  }
  var json = await res.json();
  return json.content.sha;
}

// ============================================================
// App state
// ============================================================
var state = {
  tab: 'dashboard',
  parts: [],
  sales: [],
  editingPartId: null,
  showForm: false,
  toast: null,
  pendingConfirm: null,
};

var CATEGORIES = ['Motor','Frenos','Suspensión','Eléctrico','Carrocería','Transmisión','Otro'];

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function money(n){ n = Number(n)||0; return '$' + n.toFixed(2); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function showToast(msg){
  state.toast = msg;
  render();
  setTimeout(function(){ state.toast = null; render(); }, 3400);
}

function showConfirm(message, onYes){
  state.pendingConfirm = { message: message, onYes: onYes };
  render();
}

// ---------- Derived ----------
function totals(){
  var units = 0, invCost = 0, invValue = 0, lowStock = 0;
  state.parts.forEach(function(p){
    units += Number(p.cantidad)||0;
    invCost += (Number(p.cantidad)||0) * (Number(p.costo)||0);
    invValue += (Number(p.cantidad)||0) * (Number(p.precio)||0);
    if((Number(p.cantidad)||0) <= (Number(p.stockMinimo)||0)) lowStock++;
  });
  var salesTotal = 0, profitTotal = 0;
  state.sales.forEach(function(s){ salesTotal += Number(s.total)||0; profitTotal += Number(s.ganancia)||0; });
  return {units:units, invCost:invCost, invValue:invValue, lowStock:lowStock, salesTotal:salesTotal, profitTotal:profitTotal};
}

// ---------- Rendering ----------
function render(){
  var app = document.getElementById('app');
  if(!app) return;
  app.innerHTML =
    renderSidebar() +
    '<div class="main">' + renderPage() + '</div>' +
    (state.toast ? '<div class="toast">' + esc(state.toast) + '</div>' : '') +
    (state.pendingConfirm ? renderConfirmModal() : '');
  attachHandlers();
}

function renderConfirmModal(){
  return '<div class="modal-overlay" id="modal-overlay"><div class="modal-box">' +
    '<p>' + esc(state.pendingConfirm.message) + '</p>' +
    '<div class="modal-actions">' +
      '<button class="btn" id="modal-cancel">Cancelar</button>' +
      '<button class="btn btn-accent" id="modal-confirm">Continuar</button>' +
    '</div>' +
  '</div></div>';
}

function renderSidebar(){
  var items = [
    {id:'dashboard', label:'Resumen'},
    {id:'inventario', label:'Inventario'},
    {id:'venta', label:'Registrar venta'},
    {id:'historial', label:'Historial'},
  ];
  return '<div class="sidebar">' +
    '<div class="brand"><div class="mark">R</div><h1>Refacciones</h1><p>Control de inventario</p></div>' +
    items.map(function(it){
      return '<div class="nav-item ' + (state.tab===it.id?'active':'') + '" data-tab="' + it.id + '"><span class="dot"></span>' + it.label + '</div>';
    }).join('') +
    '<div style="margin-top:auto; padding:14px 20px 0 20px; border-top:1px solid var(--border);">' +
      '<div style="font-size:9.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.07em; margin:14px 0 8px 0; font-family:Oswald,sans-serif;">Respaldo</div>' +
      '<button class="btn btn-accent" id="btn-share" style="width:100%; text-align:left; padding:8px 10px; margin-bottom:8px;">⇩ Descargar copia (.json)</button>' +
      '<div class="hint" style="margin:-4px 0 10px 0;">Este link ya se actualiza solo — esto es solo un respaldo extra.</div>' +
      '<button class="btn btn-ghost" id="btn-import" style="width:100%; text-align:left; padding:8px 0;">Importar copia</button>' +
      '<input type="file" id="import-file" accept=".json,application/json" style="display:none;">' +
      '<button class="btn btn-ghost" id="btn-lock" style="width:100%; text-align:left; padding:8px 0; color:var(--text-muted);">Cerrar sesión</button>' +
    '</div>' +
  '</div>';
}

function renderPage(){
  if(state.tab==='dashboard') return renderDashboard();
  if(state.tab==='inventario') return renderInventario();
  if(state.tab==='venta') return renderVenta();
  if(state.tab==='historial') return renderHistorial();
  return '';
}

function renderDashboard(){
  var t = totals();
  var low = state.parts.filter(function(p){ return (Number(p.cantidad)||0) <= (Number(p.stockMinimo)||0); });
  return '' +
  '<div class="page-header"><div><h2>Resumen</h2><div class="sub">Estado actual de tu inventario de repuestos</div></div></div>' +
  '<div class="stats">' +
    '<div class="stat-plate"><div class="label">Piezas en stock</div><div class="value">' + t.units + '</div></div>' +
    '<div class="stat-plate"><div class="label">Invertido (Amazon)</div><div class="value">' + money(t.invCost) + '</div></div>' +
    '<div class="stat-plate"><div class="label">Valor de venta</div><div class="value accent">' + money(t.invValue) + '</div></div>' +
    '<div class="stat-plate"><div class="label">Ganancia potencial</div><div class="value good">' + money(t.invValue - t.invCost) + '</div></div>' +
  '</div>' +
  '<div class="stats" style="grid-template-columns:repeat(2,1fr);">' +
    '<div class="stat-plate"><div class="label">Total vendido</div><div class="value">' + money(t.salesTotal) + '</div></div>' +
    '<div class="stat-plate"><div class="label">Ganancia realizada</div><div class="value good">' + money(t.profitTotal) + '</div></div>' +
  '</div>' +
  '<div class="section-title">Alertas de stock bajo</div>' +
  (low.length===0 ?
    '<div class="card"><div class="empty"><div class="display">Todo en orden</div>Ninguna pieza está por debajo de su mínimo.</div></div>' :
    '<div class="card"><table><thead><tr><th>Pieza</th><th>Categoría</th><th>Stock</th><th>Mínimo</th><th></th></tr></thead><tbody>' +
      low.map(function(p){
        return '<tr class="row-hover"><td>' + esc(p.nombre) + '</td><td><span class="cat-pill">' + esc(p.categoria) + '</span></td>' +
          '<td><span class="badge badge-low">' + p.cantidad + '</span></td><td>' + p.stockMinimo + '</td>' +
          '<td><button class="btn btn-ghost" data-goto-edit="' + p.id + '">Reabastecer →</button></td></tr>';
      }).join('') +
    '</tbody></table></div>'
  ) +
  (state.parts.length===0 ? '<div class="card" style="margin-top:18px;"><div class="empty"><div class="display">Aún no tienes piezas registradas</div>Empieza agregando el primer repuesto que compraste en Amazon.<br><br><button class="btn btn-accent" data-tab="inventario">+ Agregar la primera pieza</button></div></div>' : '');
}

function renderInventario(){
  var editing = state.editingPartId ? state.parts.find(function(p){return p.id===state.editingPartId;}) : null;
  return '' +
  '<div class="page-header"><div><h2>Inventario</h2><div class="sub">Registra cada repuesto con su costo real de compra y su precio de venta</div></div>' +
    '<div style="display:flex; gap:8px; flex-wrap:wrap;">' +
      (!editing ? '<button class="btn btn-accent" id="btn-new-part">+ Nueva pieza</button>' : '') +
    '</div>' +
  '</div>' +
  (state.showForm || editing ? renderPartForm(editing) : '') +
  (state.parts.length===0 && !state.showForm ?
    '<div class="card"><div class="empty"><div class="display">Inventario vacío</div>Agrega tu primera pieza para empezar a organizarlo todo.</div></div>' :
    '<div class="tag-grid">' + state.parts.map(renderPartTag).join('') + '</div>'
  );
}

function renderPartTag(p){
  var low = (Number(p.cantidad)||0) <= (Number(p.stockMinimo)||0);
  var margin = (Number(p.precio)||0) - (Number(p.costo)||0);
  return '<div class="part-tag">' +
    (low ? '<div class="ribbon">Stock bajo</div>' : '') +
    '<h3>' + esc(p.nombre) + '</h3>' +
    '<div class="sku">' + esc(p.sku || 'sin código') + ' · <span class="cat-pill">' + esc(p.categoria) + '</span></div>' +
    '<div class="row"><span class="k">Costo Amazon</span><span class="v">' + money(p.costo) + '</span></div>' +
    '<div class="row"><span class="k">Precio de venta</span><span class="v">' + money(p.precio) + '</span></div>' +
    '<div class="row"><span class="k">Margen</span><span class="v" style="color:' + (margin>=0?'var(--good)':'var(--danger)') + '">' + money(margin) + '</span></div>' +
    '<div class="row"><span class="k">En stock</span><span class="v"><span class="badge ' + (low?'badge-low':'badge-ok') + '">' + p.cantidad + ' uds</span></span></div>' +
    '<div class="actions">' +
      '<button class="btn btn-ghost" data-edit-part="' + p.id + '">Editar</button>' +
      '<button class="btn btn-ghost" data-del-part="' + p.id + '" style="color:var(--danger);">Eliminar</button>' +
    '</div>' +
  '</div>';
}

function renderPartForm(editing){
  var p = editing || {nombre:'',categoria:CATEGORIES[0],sku:'',costo:'',precio:'',cantidad:'',stockMinimo:'',enlace:''};
  return '<div class="card" style="margin-bottom:18px;">' +
    '<div class="section-title" style="margin-top:0;">' + (editing? 'Editar pieza' : 'Nueva pieza') + '</div>' +
    '<div class="form-grid" id="part-form">' +
      field('Nombre de la pieza','nombre','text',p.nombre,'full','Ej. Bomba de freno delantera') +
      field('Categoría','categoria','select',p.categoria) +
      field('Código / SKU','sku','text',p.sku,'','Opcional') +
      field('Costo en Amazon (por unidad)','costo','number',p.costo) +
      field('Precio de venta (por unidad)','precio','number',p.precio) +
      field('Cantidad en stock','cantidad','number',p.cantidad) +
      field('Stock mínimo (alerta)','stockMinimo','number',p.stockMinimo) +
      field('Link de Amazon','enlace','text',p.enlace,'full','Opcional — para reordenar fácil') +
      '<div class="form-actions">' +
        '<button class="btn btn-accent" id="btn-save-part">' + (editing?'Guardar cambios':'Agregar al inventario') + '</button>' +
        '<button class="btn" id="btn-cancel-part">Cancelar</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function field(label, name, type, value, extraClass, placeholder){
  var cls = 'field' + (extraClass==='full' ? ' full' : '');
  if(type==='select'){
    return '<div class="' + cls + '"><label>' + label + '</label><select data-field="' + name + '">' +
      CATEGORIES.map(function(c){ return '<option value="'+c+'" ' + (c===value?'selected':'') + '>'+c+'</option>'; }).join('') +
    '</select></div>';
  }
  return '<div class="' + cls + '"><label>' + label + '</label><input data-field="' + name + '" type="' + type + '" ' + (type==='number'?'step="0.01" min="0"':'') + ' value="' + esc(value) + '" placeholder="' + esc(placeholder||'') + '"></div>';
}

function renderVenta(){
  var available = state.parts.filter(function(p){ return (Number(p.cantidad)||0) > 0; });
  return '' +
  '<div class="page-header"><div><h2>Registrar venta</h2><div class="sub">Descuenta del inventario y calcula la ganancia automáticamente</div></div></div>' +
  (available.length===0 ?
    '<div class="card"><div class="empty"><div class="display">No hay piezas disponibles para vender</div>Agrega inventario primero desde la sección Inventario.</div></div>' :
    '<div class="card"><div class="form-grid" id="sale-form">' +
      '<div class="field full"><label>Pieza</label><select id="sale-part">' +
        available.map(function(p){ return '<option value="'+p.id+'">' + esc(p.nombre) + ' — disponibles: ' + p.cantidad + ' — ' + money(p.precio) + '</option>'; }).join('') +
      '</select></div>' +
      '<div class="field"><label>Cantidad vendida</label><input id="sale-qty" type="number" min="1" step="1" value="1"></div>' +
      '<div class="field"><label>Total a cobrar</label><input id="sale-total" type="text" value="" disabled></div>' +
      '<div class="form-actions">' +
        '<button class="btn btn-accent" id="btn-register-sale">Registrar venta</button>' +
      '</div>' +
    '</div></div>'
  );
}

function renderHistorial(){
  var sales = state.sales.slice().reverse();
  return '' +
  '<div class="page-header"><div><h2>Historial de ventas</h2><div class="sub">Todo lo que has vendido, con su ganancia</div></div></div>' +
  (sales.length===0 ?
    '<div class="card"><div class="empty"><div class="display">Aún no hay ventas registradas</div>Cuando registres una venta, aparecerá aquí.</div></div>' :
    '<div class="card"><table><thead><tr><th>Fecha</th><th>Pieza</th><th>Cant.</th><th>Total</th><th>Ganancia</th><th></th></tr></thead><tbody>' +
      sales.map(function(s){
        return '<tr class="row-hover"><td>' + new Date(s.fecha).toLocaleDateString('es-ES', {day:'2-digit',month:'short',year:'numeric'}) + '</td>' +
          '<td>' + esc(s.nombre) + '</td><td>' + s.cantidad + '</td><td>' + money(s.total) + '</td>' +
          '<td style="color:var(--good);">' + money(s.ganancia) + '</td>' +
          '<td><button class="btn btn-ghost" data-undo-sale="' + s.id + '" style="color:var(--danger);">Deshacer</button></td></tr>';
      }).join('') +
    '</tbody></table></div>'
  );
}

// ---------- Handlers ----------
function attachHandlers(){
  document.querySelectorAll('[data-tab]').forEach(function(el){
    el.addEventListener('click', function(){
      state.tab = el.getAttribute('data-tab');
      state.editingPartId = null;
      state.showForm = false;
      render();
    });
  });

  var btnNew = document.getElementById('btn-new-part');
  if(btnNew) btnNew.addEventListener('click', function(){ state.showForm = true; state.editingPartId = null; render(); });

  var btnCancel = document.getElementById('btn-cancel-part');
  if(btnCancel) btnCancel.addEventListener('click', function(){ state.showForm = false; state.editingPartId = null; render(); });

  var btnSave = document.getElementById('btn-save-part');
  if(btnSave) btnSave.addEventListener('click', onSavePart);

  document.querySelectorAll('[data-edit-part]').forEach(function(el){
    el.addEventListener('click', function(){
      state.editingPartId = el.getAttribute('data-edit-part');
      state.showForm = false;
      render();
      var top = document.querySelector('.main'); if(top) top.scrollTop = 0;
      window.scrollTo(0,0);
    });
  });
  document.querySelectorAll('[data-goto-edit]').forEach(function(el){
    el.addEventListener('click', function(){
      state.tab = 'inventario';
      state.editingPartId = el.getAttribute('data-goto-edit');
      render();
    });
  });
  document.querySelectorAll('[data-del-part]').forEach(function(el){
    el.addEventListener('click', function(){
      var id = el.getAttribute('data-del-part');
      var part = state.parts.find(function(p){return p.id===id;});
      showConfirm('¿Eliminar "' + (part?part.nombre:'esta pieza') + '" del inventario?', async function(){
        var snapshot = state.parts;
        state.parts = state.parts.filter(function(p){ return p.id!==id; });
        render();
        var ok = await persist();
        if(ok){
          showToast('Pieza eliminada');
        } else {
          state.parts = snapshot;
          render();
        }
      });
    });
  });
  document.querySelectorAll('[data-undo-sale]').forEach(function(el){
    el.addEventListener('click', function(){
      var id = el.getAttribute('data-undo-sale');
      var sale = state.sales.find(function(s){return s.id===id;});
      if(!sale) return;
      var partStillExists = state.parts.some(function(p){return p.id===sale.parteId;});
      var msg = '¿Deshacer la venta de ' + sale.cantidad + ' × "' + sale.nombre + '"? ' +
        (partStillExists ? 'Esto la quita del historial y regresa la cantidad al inventario.' : 'Esta pieza ya no está en tu inventario, así que solo se quitará del historial (no se puede devolver el stock).');
      showConfirm(msg, async function(){
        var snapshotParts = state.parts, snapshotSales = state.sales;
        state.sales = state.sales.filter(function(s){ return s.id!==id; });
        if(partStillExists){
          state.parts = state.parts.map(function(p){
            return p.id===sale.parteId ? Object.assign({}, p, { cantidad: (Number(p.cantidad)||0) + Number(sale.cantidad||0) }) : p;
          });
        }
        render();
        var ok = await persist();
        if(ok){
          showToast('Venta deshecha' + (partStillExists ? ' — stock restaurado' : ''));
        } else {
          state.parts = snapshotParts;
          state.sales = snapshotSales;
          render();
        }
      });
    });
  });

  var partSel = document.getElementById('sale-part');
  var qtyInput = document.getElementById('sale-qty');
  if(partSel && qtyInput){
    var updateTotal = function(){
      var p = state.parts.find(function(pp){return pp.id===partSel.value;});
      var raw = qtyInput.value;
      var qty = parseInt(raw, 10);
      var totalEl = document.getElementById('sale-total');
      if(!totalEl) return;
      if(!p || raw==='' || isNaN(qty) || qty < 1){ totalEl.value = ''; return; }
      totalEl.value = '$' + (qty * (Number(p.precio)||0)).toFixed(2);
    };
    var clampQty = function(){
      var p = state.parts.find(function(pp){return pp.id===partSel.value;});
      var maxQty = p ? Number(p.cantidad)||0 : 0;
      var qty = parseInt(qtyInput.value, 10);
      if(isNaN(qty) || qty < 1) qty = 1;
      if(qty > maxQty) qty = maxQty || 1;
      qtyInput.value = qty;
      updateTotal();
    };
    partSel.addEventListener('change', clampQty);
    qtyInput.addEventListener('input', updateTotal);
    qtyInput.addEventListener('change', clampQty);
    qtyInput.addEventListener('blur', clampQty);
    clampQty();
  }

  var btnSale = document.getElementById('btn-register-sale');
  if(btnSale) btnSale.addEventListener('click', onRegisterSale);

  var modalConfirm = document.getElementById('modal-confirm');
  var modalCancel = document.getElementById('modal-cancel');
  if(modalConfirm) modalConfirm.addEventListener('click', function(){
    var action = state.pendingConfirm && state.pendingConfirm.onYes;
    state.pendingConfirm = null;
    if(action) action();
  });
  if(modalCancel) modalCancel.addEventListener('click', function(){
    state.pendingConfirm = null;
    render();
  });

  var btnShare = document.getElementById('btn-share');
  if(btnShare) btnShare.addEventListener('click', doShare);

  var btnImport = document.getElementById('btn-import');
  var importFile = document.getElementById('import-file');
  if(btnImport && importFile){
    btnImport.addEventListener('click', function(){ importFile.click(); });
    importFile.addEventListener('change', doImport);
  }

  var btnLock = document.getElementById('btn-lock');
  if(btnLock) btnLock.addEventListener('click', function(){
    localStorage.removeItem(UNLOCK_KEY);
    renderPasswordGate();
  });
}

function doShare(){
  try{
    var payload = JSON.stringify({ parts: state.parts, sales: state.sales, exportedAt: new Date().toISOString() }, null, 2);
    var blob = new Blob([payload], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = 'refacciones-inventario-' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    showToast('Copia descargada');
  }catch(e){
    showToast('No se pudo descargar la copia: ' + (e && e.message ? e.message : 'error desconocido'));
  }
}

function doImport(e){
  var file = e.target.files && e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(evt){
    var text = evt.target.result;
    var data = null;
    try{ data = JSON.parse(text); }catch(err){ showToast('No se pudo leer el archivo (formato no reconocido)'); return; }
    if(!data || !Array.isArray(data.parts) || !Array.isArray(data.sales)){
      showToast('El archivo no contiene un inventario reconocible');
      return;
    }
    showConfirm('Esto reemplazará el inventario y ventas actuales con los del archivo (' + data.parts.length + ' piezas). ¿Continuar?', async function(){
      var snapshotParts = state.parts, snapshotSales = state.sales;
      state.parts = data.parts;
      state.sales = data.sales;
      render();
      var ok = await persist();
      if(ok){
        showToast('Inventario importado y guardado');
      } else {
        state.parts = snapshotParts;
        state.sales = snapshotSales;
        render();
      }
    });
  };
  reader.readAsText(file);
  e.target.value = '';
}

async function onSavePart(){
  var form = document.getElementById('part-form');
  var data = {};
  form.querySelectorAll('[data-field]').forEach(function(el){
    data[el.getAttribute('data-field')] = el.value;
  });
  if(!data.nombre || !data.nombre.trim()){
    showToast('Ponle un nombre a la pieza');
    return;
  }
  data.costo = parseFloat(data.costo)||0;
  data.precio = parseFloat(data.precio)||0;
  data.cantidad = parseInt(data.cantidad)||0;
  data.stockMinimo = parseInt(data.stockMinimo)||0;

  var snapshot = state.parts;
  var wasEditing = !!state.editingPartId;

  if(state.editingPartId){
    var idx = state.parts.findIndex(function(p){return p.id===state.editingPartId;});
    if(idx>-1) state.parts = state.parts.map(function(p, i){ return i===idx ? Object.assign({}, p, data) : p; });
    state.editingPartId = null;
  } else {
    data.id = uid();
    data.fecha = new Date().toISOString();
    state.parts = state.parts.concat([data]);
  }
  state.showForm = false;
  render();

  var ok = await persist();
  if(ok){
    showToast(wasEditing ? 'Pieza actualizada' : 'Pieza agregada al inventario');
  } else {
    state.parts = snapshot;
    render();
  }
}

async function onRegisterSale(){
  var partSel = document.getElementById('sale-part');
  var qtyInput = document.getElementById('sale-qty');
  var p = state.parts.find(function(pp){return pp.id===partSel.value;});
  if(!p) return;
  var qty = Math.max(1, parseInt(qtyInput.value)||1);
  if(qty > Number(p.cantidad)){ showToast('No hay suficiente stock'); return; }

  var total = qty * (Number(p.precio)||0);
  var ganancia = qty * ((Number(p.precio)||0) - (Number(p.costo)||0));

  var snapshotParts = state.parts, snapshotSales = state.sales;

  state.sales = state.sales.concat([{
    id: uid(),
    parteId: p.id,
    nombre: p.nombre,
    cantidad: qty,
    precioUnitario: p.precio,
    costoUnitario: p.costo,
    total: total,
    ganancia: ganancia,
    fecha: new Date().toISOString(),
  }]);
  state.parts = state.parts.map(function(pp){
    return pp.id===p.id ? Object.assign({}, pp, { cantidad: (Number(pp.cantidad)||0) - qty }) : pp;
  });
  render();

  var ok = await persist();
  if(ok){
    showToast('Venta registrada: ' + money(total));
  } else {
    state.parts = snapshotParts;
    state.sales = snapshotSales;
    render();
  }
}

async function persist(){
  try{
    var newSha = await ghPutFile({ parts: state.parts, sales: state.sales }, currentSha);
    currentSha = newSha;
    return true;
  }catch(err){
    if(err && err.code === 'conflict'){
      try{
        var fresh = await ghGetFile();
        state.parts = fresh.data.parts;
        state.sales = fresh.data.sales;
        currentSha = fresh.sha;
        render();
        showToast('Alguien más guardó un cambio primero — esta pantalla se actualizó con lo más reciente. Si tu cambio aún aplica, hazlo de nuevo.');
      }catch(e2){
        showToast('Hubo un conflicto al guardar. Recarga la página e intenta de nuevo.');
      }
      return false;
    }
    showToast('No se pudo guardar: ' + (err && err.message ? err.message : 'revisa tu conexión a internet'));
    return false;
  }
}

// ============================================================
// Boot / auth
// ============================================================
function renderFullscreenMessage(html){
  document.getElementById('app').innerHTML =
    '<div style="min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center; padding:32px;">' + html + '</div>';
}

function renderLoading(msg){
  renderFullscreenMessage(
    '<div style="text-align:center; color:var(--text); font-family:\'IBM Plex Mono\', monospace;">' + esc(msg) + '</div>'
  );
}

function renderErrorScreen(msg){
  renderFullscreenMessage(
    '<div class="card" style="max-width:360px; width:100%; text-align:center;">' +
      '<div class="display" style="color:var(--danger); margin-bottom:10px;">No se pudo cargar</div>' +
      '<p style="color:var(--text-muted); font-size:12.5px; margin:0 0 16px 0;">' + esc(msg) + '</p>' +
      '<button class="btn btn-accent" id="btn-retry" style="width:100%;">Reintentar</button>' +
    '</div>'
  );
  var btn = document.getElementById('btn-retry');
  if(btn) btn.addEventListener('click', boot);
}

function renderPasswordGate(errorMsg){
  renderFullscreenMessage(
    '<div class="card" style="max-width:340px; width:100%;">' +
      '<div class="mark" style="margin-bottom:14px;">R</div>' +
      '<div class="section-title" style="margin-top:0;">Refacciones</div>' +
      '<p style="color:var(--text-muted); font-size:12.5px; margin:0 0 16px 0;">Ingresa la contraseña para ver el inventario.</p>' +
      '<div class="field"><label>Contraseña</label><input id="pw-input" type="password" autocomplete="current-password"></div>' +
      (errorMsg ? '<div style="color:var(--danger); font-size:12px; margin-top:8px;">' + esc(errorMsg) + '</div>' : '') +
      '<div class="form-actions" style="margin-top:16px;"><button class="btn btn-accent" id="pw-submit" style="width:100%;">Entrar</button></div>' +
    '</div>'
  );
  var input = document.getElementById('pw-input');
  var submitBtn = document.getElementById('pw-submit');
  if(submitBtn) submitBtn.addEventListener('click', onPasswordSubmit);
  if(input){
    input.focus();
    input.addEventListener('keydown', function(e){ if(e.key==='Enter') onPasswordSubmit(); });
  }
}

async function onPasswordSubmit(){
  var input = document.getElementById('pw-input');
  var val = input ? input.value : '';
  var submitBtn = document.getElementById('pw-submit');
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = 'Verificando…'; }
  var hash = await sha256Hex(val);
  if(hash === PASSWORD_HASH){
    localStorage.setItem(UNLOCK_KEY, '1');
    boot();
  } else {
    renderPasswordGate('Contraseña incorrecta, intenta de nuevo.');
  }
}

async function boot(){
  renderLoading('Cargando inventario…');
  try{
    var result = await ghGetFile();
    state.parts = result.data.parts;
    state.sales = result.data.sales;
    currentSha = result.sha;
    state.tab = 'dashboard';
    render();
  }catch(err){
    renderErrorScreen(err && err.message ? err.message : 'revisa tu conexión a internet e intenta de nuevo.');
  }
}

if(localStorage.getItem(UNLOCK_KEY) === '1'){
  boot();
} else {
  renderPasswordGate();
}

</script>
